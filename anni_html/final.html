<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang Cuối</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg1:#fff0f3;--bg2:#ffe6ea;--accent:#ff5e7e;--muted:#7a7a7a}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',sans-serif}
        html,body{height:100%}
        body{background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{background:#fff;padding:28px;border-radius:14px;max-width:720px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.08);text-align:center}
        h2{font-size:1.6rem;color:#333;margin-bottom:8px}
        p.lead{color:var(--muted);line-height:1.4;margin-bottom:18px}
        .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
        .btn{display:inline-block;padding:10px 18px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .12s ease, box-shadow .12s ease}
        .btn.secondary{background:#f4f4f4;color:#333}
        .btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(255,94,126,0.12)}
        .meta{margin-top:18px;color:#999;font-size:.9rem}
        @media (max-width:420px){.card{padding:18px} .btn{width:100%}}
    </style>
</head>
<body>
    <div class="card">
        <h2>Hoàn thành rồi đó em.</h2>
        <p class="lead">Bây giờ thì em có thể thoát, hoặc là lưu lại cái này dưới hình thức nào đó hihi. Love you Mít iuuu.</p>
        <div class="actions">
            <a class="btn" href="result.html">Xem kết quả</a>
            <a class="btn secondary" href="main.html">Bắt đầu lại</a>
        </div>
        <div class="meta">Made by Thanh Duy</div>
    </div>
</body>
</html>
