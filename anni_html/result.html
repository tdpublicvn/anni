<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',sans-serif}
        body{background:linear-gradient(135deg,#ffdde1 0%,#ee9ca7 100%);height:100vh;display:flex;justify-content:center;align-items:center}
        .card{background:rgba(255,255,255,.94);padding:28px;border-radius:20px;max-width:520px;width:94%;text-align:center;box-shadow:0 10px 30px rgba(238,156,167,.35)}
        h2{color:#ff5e7e;margin-bottom:6px}
        p{color:#666;margin-bottom:12px}
        .score{font-size:28px;color:#ff5e7e;font-weight:800;margin:12px 0}
        .btn{display:inline-block;padding:10px 16px;border-radius:12px;border:none;background:#ff5e7e;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
        .small{color:#666;margin-top:10px}
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size:48px">💖</div>
        <h2>Kết quả Quiz</h2>
        <p id="msg">Đang tính điểm...</p>
        <div class="score" id="score"></div>
        <a href="main.html" class="btn" id="restart">Bắt đầu lại</a>
        <div class="small">Nếu muốn xem đáp án, kéo xuống console hoặc chỉnh sửa trong mã.</div>
    </div>

    <script>
        // Đáp án đúng (bạn có thể chỉnh sửa) — q1 có thể là nhiều đáp án đúng
        const answers = { q1: ['0508','2501'], q2: 'phở', q3: 'kem', q4: 'vui' };

        const q1 = localStorage.getItem('q1') || '';
        const q2 = localStorage.getItem('q2') || '';
        const q3 = localStorage.getItem('q3') || '';
        const q4 = localStorage.getItem('q4') || '';
        // q5_text là câu trả lời dạng văn bản (không tính điểm tự động ở đây)
        const q5_text = localStorage.getItem('q5_text') || '';

        let score = 0;
        if(Array.isArray(answers.q1) ? answers.q1.includes(q1) : q1 === answers.q1) score++;
        if(q2 === answers.q2) score++;
        if(q3 === answers.q3) score++;
        if(q4 === answers.q4) score++;

        // Hiển thị điểm trên tổng 4 câu trắc nghiệm
        document.getElementById('score').textContent = score + ' / 4';

        const msg = document.getElementById('msg');
        if(score === 4) msg.textContent = 'Tuyệt vời! Em đúng hết rồi 😍';
        else if(score >= 3) msg.textContent = 'Rất tốt! Gần đúng nhiều câu rồi 💕';
        else msg.textContent = 'Đừng lo, còn nhiều điều để khám phá về nhau nữa nha 🥰';

        console.log('Đáp án nhập:', {q1,q2,q3,q4,q5_text});
    </script>
</body>
</html>
